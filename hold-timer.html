<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>운동 타이머</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --exercise-color: #e8ff47;
    --rest-color: #47b8ff;
    --text: #ffffff;
    --muted: #444;
    --surface: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    height: -webkit-fill-available;
    overflow: hidden;
    position: fixed;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .phase-bar {
    height: 4px;
    background: var(--muted);
    transition: background 0.5s;
    flex-shrink: 0;
  }
  .phase-bar.exercise { background: var(--exercise-color); }
  .phase-bar.rest { background: var(--rest-color); }

  .set-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px 4px;
    flex-shrink: 0;
  }

  .set-badge {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .set-badge span { color: var(--text); font-weight: 700; }

  .phase-tag {
    font-size: 10px;
    letter-spacing: 2px;
    padding: 3px 10px;
    border-radius: 100px;
    text-transform: uppercase;
    font-weight: 700;
    transition: all 0.5s;
    border: 1px solid var(--muted);
    color: var(--muted);
  }
  .phase-tag.exercise { border-color: var(--exercise-color); color: var(--exercise-color); }
  .phase-tag.rest { border-color: var(--rest-color); color: var(--rest-color); }

  .main {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 16px 0 8px;
  }

  .big-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: min(38vw, 160px);
    line-height: 1;
    transition: color 0.3s, text-shadow 0.3s;
    color: var(--exercise-color);
    text-shadow: 0 0 40px rgba(232,255,71,0.3);
  }
  .big-number.rest-mode {
    color: var(--rest-color);
    text-shadow: 0 0 40px rgba(71,184,255,0.3);
  }
  .big-number.pulse { animation: numPulse 0.15s ease; }

  @keyframes numPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .total-label {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 2px;
    font-family: 'Bebas Neue', sans-serif;
  }
  .total-label span { color: var(--text); }

  .progress-wrap {
    width: 70%;
    max-width: 260px;
    margin-top: 14px;
    height: 3px;
    background: var(--surface);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.9s linear, background 0.5s;
    background: var(--exercise-color);
  }
  .progress-fill.rest { background: var(--rest-color); }

  .settings {
    padding: 6px 14px;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .setting-card {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border-radius: 12px;
    padding: 8px 2px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .setting-label {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .s-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: #2a2a2a;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  .s-btn:active { background: #3a3a3a; }

  .s-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: var(--text);
    outline: none;
    width: 36px;
    -moz-appearance: textfield;
  }
  .s-val::-webkit-outer-spin-button,
  .s-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .s-val:focus { border-bottom-color: var(--exercise-color); }

  .controls {
    padding: 8px 14px 28px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-start {
    flex: 1;
    height: 54px;
    border-radius: 14px;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--exercise-color);
    color: #000;
  }
  .btn-start:active { transform: scale(0.97); }
  .btn-start.running { background: #2a2a2a; color: var(--text); }

  .btn-reset {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-reset:active { background: #1a1a1a; color: var(--text); }

  .done-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,13,13,0.97);
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .done-overlay.show { display: flex; }
  .done-icon { font-size: 56px; }
  .done-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 4px;
    color: var(--exercise-color);
  }
  .done-sub { color: var(--muted); font-size: 13px; letter-spacing: 1px; }
  .btn-again {
    margin-top: 6px;
    background: var(--exercise-color);
    color: #000;
    border: none;
    border-radius: 14px;
    padding: 14px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="phase-bar" id="phaseBar"></div>

<div class="set-row">
  <div class="set-badge">세트 <span id="setDisplay">1</span> / <span id="totalSetDisplay">3</span></div>
  <div class="phase-tag" id="phaseTag">대기</div>
</div>

<div class="main">
  <div class="big-number" id="bigNum">0</div>
  <div class="total-label">/ <span id="totalLabel">10</span> 초</div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="settings">
  <div class="setting-card">
    <div class="setting-label">운동 (초)</div>
    <div class="setting-row">
      <button class="s-btn" onclick="adj('ex',-1)">−</button>
      <input class="s-val" id="exVal" type="number" value="10" min="1" max="300" oninput="setDirect('ex',this.value)" onblur="validateInput('ex',this)">
      <button class="s-btn" onclick="adj('ex',1)">+</button>
    </div>
  </div>
  <div class="setting-card">
    <div class="setting-label">휴식 (초)</div>
    <div class="setting-row">
      <button class="s-btn" onclick="adj('rest',-1)">−</button>
      <input class="s-val" id="restVal" type="number" value="5" min="1" max="300" oninput="setDirect('rest',this.value)" onblur="validateInput('rest',this)">
      <button class="s-btn" onclick="adj('rest',1)">+</button>
    </div>
  </div>
  <div class="setting-card">
    <div class="setting-label">세트</div>
    <div class="setting-row">
      <button class="s-btn" onclick="adj('sets',-1)">−</button>
      <input class="s-val" id="setsVal" type="number" value="10" min="1" max="20" oninput="setDirect('sets',this.value)" onblur="validateInput('sets',this)">
      <button class="s-btn" onclick="adj('sets',1)">+</button>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn-start" id="startBtn" onclick="toggleStart()">시작</button>
  <button class="btn-reset" onclick="resetTimer()">↺</button>
</div>

<div class="done-overlay" id="doneOverlay">
  <div class="done-icon">🔥</div>
  <div class="done-title">완료!</div>
  <div class="done-sub" id="doneSub"></div>
  <button class="btn-again" onclick="resetTimer()">다시 시작</button>
</div>

<script>
let exSeconds = 10;
let restSeconds = 5;
let totalSets = 10;

let currentSet = 1;
let isRunning = false;
let isResting = false;
let currentTick = 0;
let timer = null;
let synth = window.speechSynthesis;

function speak(text, rate) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = rate || 1.0;
  u.pitch = 1.0;
  u.volume = 1.0;
  synth.speak(u);
}

function adj(type, delta) {
  if (isRunning) return;
  if (type === 'ex') {
    exSeconds = Math.max(1, Math.min(300, exSeconds + delta));
    document.getElementById('exVal').value = exSeconds;
  } else if (type === 'rest') {
    restSeconds = Math.max(1, Math.min(300, restSeconds + delta));
    document.getElementById('restVal').value = restSeconds;
  } else {
    totalSets = Math.max(1, Math.min(20, totalSets + delta));
    document.getElementById('setsVal').value = totalSets;
    document.getElementById('totalSetDisplay').textContent = totalSets;
  }
  updateDisplay(0, false);
}

function setDirect(type, val) {
  if (isRunning) return;
  const n = parseInt(val);
  if (isNaN(n)) return;
  if (type === 'ex') exSeconds = Math.max(1, Math.min(300, n));
  else if (type === 'rest') restSeconds = Math.max(1, Math.min(300, n));
  else { totalSets = Math.max(1, Math.min(20, n)); document.getElementById('totalSetDisplay').textContent = totalSets; }
  updateDisplay(0, false);
}

function validateInput(type, el) {
  const n = parseInt(el.value);
  if (isNaN(n) || n < 1) {
    if (type === 'ex') el.value = exSeconds;
    else if (type === 'rest') el.value = restSeconds;
    else el.value = totalSets;
  }
}

function updateDisplay(tick, resting) {
  const num = document.getElementById('bigNum');
  const total = resting ? restSeconds : exSeconds;
  
  num.textContent = tick;
  num.classList.toggle('rest-mode', resting);
  
  document.getElementById('totalLabel').textContent = total;
  document.getElementById('progressFill').style.width = (total > 0 ? (tick / total) * 100 : 0) + '%';
  document.getElementById('progressFill').classList.toggle('rest', resting);

  const bar = document.getElementById('phaseBar');
  const tag = document.getElementById('phaseTag');

  if (!isRunning) {
    bar.className = 'phase-bar';
    tag.className = 'phase-tag';
    tag.textContent = '대기';
  } else if (resting) {
    bar.className = 'phase-bar rest';
    tag.className = 'phase-tag rest';
    tag.textContent = '휴식';
  } else {
    bar.className = 'phase-bar exercise';
    tag.className = 'phase-tag exercise';
    tag.textContent = '운동';
  }

  // Pop animation
  num.classList.remove('pulse');
  void num.offsetWidth;
  num.classList.add('pulse');
}

function toggleStart() {
  if (isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  isRunning = true;
  document.getElementById('startBtn').textContent = '일시정지';
  document.getElementById('startBtn').classList.add('running');

  if (currentTick === 0 && !isResting) {
    // Fresh start of exercise phase
    speak(currentSet + '세트 시작');
    setTimeout(() => runExercise(), 700);
  } else {
    // Resume
    if (isResting) {
      runRest(currentTick);
    } else {
      runExercise(currentTick);
    }
  }
}

function runExercise(startFrom) {
  isResting = false;
  const from = startFrom || 0;
  currentTick = from;
  updateDisplay(currentTick, false);

  timer = setInterval(() => {
    if (!isRunning) return;
    currentTick++;
    updateDisplay(currentTick, false);

    // Speak the number
    speak(String(currentTick), 1.1);

    if (currentTick >= exSeconds) {
      clearInterval(timer);
      // Check if last set
      if (currentSet >= totalSets) {
        setTimeout(() => finishAll(), 600);
      } else {
        setTimeout(() => {
          speak('휴식');
          setTimeout(() => runRest(0), 600);
        }, 400);
      }
    }
  }, 1000);
}

function runRest(startFrom) {
  isResting = true;
  currentTick = startFrom || 0;
  updateDisplay(currentTick, true);

  timer = setInterval(() => {
    if (!isRunning) return;
    currentTick++;
    updateDisplay(currentTick, true);

    speak(String(currentTick), 1.1);

    if (currentTick >= restSeconds) {
      clearInterval(timer);
      currentSet++;
      currentTick = 0;
      document.getElementById('setDisplay').textContent = currentSet;
      setTimeout(() => {
        speak(currentSet + '세트 시작');
        setTimeout(() => runExercise(0), 700);
      }, 400);
    }
  }, 1000);
}

function pauseTimer() {
  isRunning = false;
  clearInterval(timer);
  document.getElementById('startBtn').textContent = '계속';
  document.getElementById('startBtn').classList.remove('running');
  synth.cancel();
}

function resetTimer() {
  isRunning = false;
  isResting = false;
  currentTick = 0;
  currentSet = 1;
  clearInterval(timer);
  synth.cancel();

  document.getElementById('startBtn').textContent = '시작';
  document.getElementById('startBtn').classList.remove('running');
  document.getElementById('setDisplay').textContent = 1;
  document.getElementById('doneOverlay').classList.remove('show');
  updateDisplay(0, false);
  document.getElementById('bigNum').textContent = '0';
  document.getElementById('totalLabel').textContent = exSeconds;
}

function finishAll() {
  isRunning = false;
  clearInterval(timer);
  speak('운동 완료! 수고하셨습니다!');
  document.getElementById('doneSub').textContent =
    `${totalSets}세트 × 운동 ${exSeconds}초 / 휴식 ${restSeconds}초`;
  document.getElementById('doneOverlay').classList.add('show');
}

// Init display
updateDisplay(0, false);
document.getElementById('totalLabel').textContent = exSeconds;
document.getElementById('totalSetDisplay').textContent = totalSets;
</script>
</body>
</html>
