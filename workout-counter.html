<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>운동 카운터</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --accent: #00ff88;
    --accent2: #ff6b35;
    --accent3: #4a9eff;
    --text: #f0f0f0;
    --muted: #555566;
    --border: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  #app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 30px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .app-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .set-info {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .set-info span {
    color: var(--text);
    font-weight: 700;
  }

  /* Main count display */
  .count-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .count-ring {
    position: relative;
    width: 240px;
    height: 240px;
    margin-bottom: 8px;
  }

  .count-ring svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 6;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 691;
    stroke-dashoffset: 691;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  .count-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .count-number {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 96px;
    line-height: 1;
    color: var(--text);
    transition: transform 0.1s ease;
    text-shadow: 0 0 40px rgba(0,255,136,0.2);
  }

  .count-number.pop {
    transform: scale(1.15);
  }

  .count-target {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* Status label */
  .status-label {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    min-height: 20px;
    transition: color 0.3s;
  }

  .status-label.active { color: var(--accent); }
  .status-label.rest { color: var(--accent2); }
  .status-label.listening { color: var(--accent3); }

  /* Timer (rest) */
  .rest-timer {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .rest-timer.show { display: flex; }

  .rest-countdown {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 64px;
    color: var(--accent2);
    text-shadow: 0 0 30px rgba(255,107,53,0.3);
  }

  .rest-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent2);
    opacity: 0.7;
  }

  /* Settings row */
  .settings-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .setting-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .setting-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .setting-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .setting-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .setting-btn:active {
    background: var(--border);
    transform: scale(0.9);
  }

  .setting-value {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--text);
    min-width: 36px;
    text-align: center;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .btn-main {
    flex: 1;
    height: 64px;
    border-radius: 18px;
    border: none;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .btn-main::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.1s;
  }

  .btn-main:active::after { opacity: 0.1; }

  .btn-count {
    background: var(--accent);
    color: #000;
    box-shadow: 0 4px 20px rgba(0,255,136,0.25);
  }

  .btn-mic {
    flex: 0 0 64px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-mic.on {
    border-color: var(--accent3);
    color: var(--accent3);
    box-shadow: 0 0 20px rgba(74,158,255,0.2);
  }

  .btn-mic.on .mic-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--accent3);
    animation: pulse-ring 1.2s ease-out infinite;
  }

  .mic-icon { position: relative; }

  @keyframes pulse-ring {
    0% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .btn-secondary-row {
    display: flex;
    gap: 10px;
  }

  .btn-sm {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .btn-sm:active {
    background: var(--border);
    color: var(--text);
    transform: scale(0.97);
  }

  .btn-sm.danger { border-color: rgba(255,80,80,0.3); color: rgba(255,80,80,0.6); }
  .btn-sm.danger:active { background: rgba(255,80,80,0.1); color: rgba(255,80,80,0.9); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Ripple on tap */
  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.4; }
    100% { transform: scale(4); opacity: 0; }
  }

  .ripple-effect {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
    animation: ripple 0.5s ease-out forwards;
  }

  /* Workout complete overlay */
  .complete-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.95);
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .complete-overlay.show { display: flex; }

  .complete-emoji {
    font-size: 64px;
    animation: bounce 0.5s ease;
  }

  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  .complete-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 32px;
    color: var(--accent);
    letter-spacing: 3px;
  }

  .complete-stats {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 2;
  }

  .btn-restart {
    margin-top: 12px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 14px;
    padding: 16px 40px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
  }

  /* Voice indicator */
  .voice-waves {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 20px;
    margin-bottom: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .voice-waves.active { opacity: 1; }

  .wave-bar {
    width: 3px;
    background: var(--accent3);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite alternate;
  }

  .wave-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 16px; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 12px; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 20px; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 10px; }

  @keyframes wave {
    from { transform: scaleY(0.4); }
    to { transform: scaleY(1); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="app-title">WORKOUT</div>
    <div class="set-info">세트 <span id="currentSet">1</span> / <span id="totalSetsDisplay">3</span></div>
  </div>

  <!-- Main count area or rest timer -->
  <div class="count-section">
    <!-- Rest timer (shown during rest) -->
    <div class="rest-timer" id="restTimer">
      <div class="rest-countdown" id="restCountdown">60</div>
      <div class="rest-label">REST TIME</div>
    </div>

    <!-- Count ring (shown during workout) -->
    <div class="count-ring" id="countRing">
      <svg viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="110"/>
        <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="110"/>
      </svg>
      <div class="count-display">
        <div class="count-number" id="countNumber">0</div>
        <div class="count-target" id="countTarget">/ 10 회</div>
      </div>
    </div>

    <!-- Voice waves -->
    <div class="voice-waves" id="voiceWaves">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <div class="status-label" id="statusLabel">준비</div>
  </div>

  <!-- Settings -->
  <div class="settings-row">
    <div class="setting-card">
      <div class="setting-label">목표 횟수</div>
      <div class="setting-controls">
        <button class="setting-btn" onclick="adjustTarget(-1)">−</button>
        <div class="setting-value" id="targetDisplay">10</div>
        <button class="setting-btn" onclick="adjustTarget(1)">+</button>
      </div>
    </div>
    <div class="setting-card">
      <div class="setting-label">총 세트</div>
      <div class="setting-controls">
        <button class="setting-btn" onclick="adjustSets(-1)">−</button>
        <div class="setting-value" id="setsDisplay">3</div>
        <button class="setting-btn" onclick="adjustSets(1)">+</button>
      </div>
    </div>
    <div class="setting-card">
      <div class="setting-label">휴식 (초)</div>
      <div class="setting-controls">
        <button class="setting-btn" onclick="adjustRest(-5)">−</button>
        <div class="setting-value" id="restDisplay">60</div>
        <button class="setting-btn" onclick="adjustRest(5)">+</button>
      </div>
    </div>
  </div>

  <!-- Main buttons -->
  <div class="btn-row">
    <button class="btn-main btn-count" id="countBtn" onclick="handleCount(event)">
      TAP
    </button>
    <button class="btn-main btn-mic" id="micBtn" onclick="toggleMic()" style="border-radius:18px; width:64px; flex:0 0 64px;">
      <span class="mic-icon">🎙️</span>
    </button>
  </div>

  <div class="btn-secondary-row">
    <button class="btn-sm" onclick="undoCount()">↩ 되돌리기</button>
    <button class="btn-sm" onclick="skipRest()">⏩ 휴식 건너뛰기</button>
    <button class="btn-sm danger" onclick="resetAll()">✕ 초기화</button>
  </div>
</div>

<!-- Complete overlay -->
<div class="complete-overlay" id="completeOverlay">
  <div class="complete-emoji">🏆</div>
  <div class="complete-title">완료!</div>
  <div class="complete-stats" id="completeStats"></div>
  <button class="btn-restart" onclick="resetAll()">다시 시작</button>
</div>

<div class="toast" id="toast"></div>

<script>
// State
let count = 0;
let currentSet = 1;
let targetReps = 10;
let totalSets = 3;
let restSeconds = 60;
let isResting = false;
let restInterval = null;
let micActive = false;
let recognition = null;
let speechSynth = window.speechSynthesis;

// Korean number words
const koreanNums = ['영','일','이','삼','사','오','육','칠','팔','구','십',
  '십일','십이','십삼','십사','십오','십육','십칠','십팔','십구','이십',
  '이십일','이십이','이십삼','이십사','이십오','이십육','이십칠','이십팔','이십구','삼십',
  '삼십일','삼십이','삼십삼','삼십사','삼십오','삼십육','삼십칠','삼십팔','삼십구','사십',
  '사십일','사십이','사십삼','사십사','사십오','사십육','사십칠','사십팔','사십구','오십'];

function speak(text) {
  if (!speechSynth) return;
  speechSynth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 1.1;
  utter.pitch = 1.0;
  speechSynth.speak(utter);
}

function updateRing() {
  const circumference = 2 * Math.PI * 110;
  const progress = Math.min(count / targetReps, 1);
  const offset = circumference * (1 - progress);
  const ring = document.getElementById('ringProgress');
  ring.style.strokeDashoffset = offset;
  if (count >= targetReps) {
    ring.style.stroke = 'var(--accent2)';
  } else {
    ring.style.stroke = 'var(--accent)';
  }
}

function updateDisplay() {
  document.getElementById('countNumber').textContent = count;
  document.getElementById('countTarget').textContent = `/ ${targetReps} 회`;
  document.getElementById('currentSet').textContent = currentSet;
  document.getElementById('totalSetsDisplay').textContent = totalSets;
  updateRing();
}

function handleCount(e) {
  if (isResting) return;
  
  // Ripple effect
  const btn = document.getElementById('countBtn');
  const ripple = document.createElement('div');
  ripple.className = 'ripple-effect';
  const rect = btn.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width/2) - rect.left - 30;
  const y = (e.clientY || rect.top + rect.height/2) - rect.top - 30;
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);

  incrementCount();
}

function incrementCount() {
  if (isResting) return;
  count++;
  
  // Pop animation
  const numEl = document.getElementById('countNumber');
  numEl.classList.remove('pop');
  void numEl.offsetWidth;
  numEl.classList.add('pop');
  setTimeout(() => numEl.classList.remove('pop'), 150);

  // Speak the number
  const word = count <= 50 ? koreanNums[count] : String(count);
  speak(word);

  updateDisplay();

  // Check if set complete
  if (count >= targetReps) {
    setTimeout(() => completeSet(), 400);
  }

  setStatus('active', '운동 중');
}

function completeSet() {
  if (currentSet >= totalSets) {
    // All done!
    speak('모든 세트 완료! 수고하셨습니다!');
    document.getElementById('completeStats').innerHTML =
      `총 ${totalSets}세트 완료<br>${totalSets * targetReps}회 달성`;
    document.getElementById('completeOverlay').classList.add('show');
    return;
  }

  speak(`${currentSet}세트 완료! 휴식 시작`);
  startRest();
}

function startRest() {
  isResting = true;
  let remaining = restSeconds;

  document.getElementById('countRing').style.display = 'none';
  document.getElementById('restTimer').classList.add('show');
  document.getElementById('restCountdown').textContent = remaining;
  setStatus('rest', '휴식 중');

  restInterval = setInterval(() => {
    remaining--;
    document.getElementById('restCountdown').textContent = remaining;
    
    if (remaining <= 3 && remaining > 0) speak(String(remaining));
    
    if (remaining <= 0) {
      endRest();
    }
  }, 1000);
}

function endRest() {
  clearInterval(restInterval);
  isResting = false;
  currentSet++;
  count = 0;

  document.getElementById('countRing').style.display = 'block';
  document.getElementById('restTimer').classList.remove('show');
  
  updateDisplay();
  setStatus('active', `${currentSet}세트 시작!`);
  speak(`${currentSet}세트 시작!`);
  
  setTimeout(() => setStatus('', '준비'), 2000);
}

function skipRest() {
  if (!isResting) return;
  endRest();
  showToast('휴식 건너뜀');
}

function undoCount() {
  if (count > 0 && !isResting) {
    count--;
    updateDisplay();
    setStatus('active', '취소됨');
    setTimeout(() => setStatus('', '운동 중'), 800);
  }
}

function setStatus(type, text) {
  const el = document.getElementById('statusLabel');
  el.textContent = text;
  el.className = 'status-label ' + type;
}

// Settings
function adjustTarget(delta) {
  targetReps = Math.max(1, Math.min(100, targetReps + delta));
  document.getElementById('targetDisplay').textContent = targetReps;
  updateDisplay();
}

function adjustSets(delta) {
  totalSets = Math.max(1, Math.min(10, totalSets + delta));
  document.getElementById('setsDisplay').textContent = totalSets;
  document.getElementById('totalSetsDisplay').textContent = totalSets;
}

function adjustRest(delta) {
  restSeconds = Math.max(5, Math.min(300, restSeconds + delta));
  document.getElementById('restDisplay').textContent = restSeconds;
}

function resetAll() {
  clearInterval(restInterval);
  count = 0;
  currentSet = 1;
  isResting = false;
  
  document.getElementById('countRing').style.display = 'block';
  document.getElementById('restTimer').classList.remove('show');
  document.getElementById('completeOverlay').classList.remove('show');
  
  updateDisplay();
  setStatus('', '준비');
  speak('초기화');
}

// Voice recognition
function toggleMic() {
  if (micActive) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('이 브라우저에서는 음성인식을 지원하지 않아요');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    micActive = true;
    document.getElementById('micBtn').classList.add('on');
    document.getElementById('voiceWaves').classList.add('active');
    setStatus('listening', '음성 인식 중');
    showToast('🎙 말해서 카운트: "하나", "둘"...');
  };

  recognition.onresult = (event) => {
    const last = event.results.length - 1;
    const transcript = event.results[last][0].transcript.trim().toLowerCase();
    handleVoiceInput(transcript);
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') {
      showToast('음성 인식 오류: ' + e.error);
      stopMic();
    }
  };

  recognition.onend = () => {
    if (micActive) recognition.start(); // Keep alive
  };

  recognition.start();
}

function stopMic() {
  micActive = false;
  if (recognition) recognition.stop();
  document.getElementById('micBtn').classList.remove('on');
  document.getElementById('voiceWaves').classList.remove('active');
  setStatus('', '준비');
}

// Voice command keywords that mean "count"
const countKeywords = [
  '하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열',
  'one','two','three','four','five',
  '카운트','올려','추가','업','ok','오케이','예스'
];

function handleVoiceInput(text) {
  for (const kw of countKeywords) {
    if (text.includes(kw)) {
      incrementCount();
      return;
    }
  }
  // Also if it's a pure number word
  if (/^[일이삼사오육칠팔구십]+$/.test(text) || /^\d+$/.test(text)) {
    incrementCount();
  }
}

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init
updateDisplay();
speak('운동 카운터 준비');
</script>
